workflows:
  android-apk:
    name: Signal Radar APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform files
        script: flutter create --platforms=android --org com.georges.signalradar .
      - name: Patch manifest (permissions, app name)
        script: python3 tools/patch_android.py
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
